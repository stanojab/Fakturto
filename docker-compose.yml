services:
  postgres:
    image: postgres:17
    container_name: fakturko-postgres
    restart: unless-stopped
    environment: #is read from the .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # my PC's port : container's port
    volumes:
      - pgdata:/var/lib/postgresql/data # data survives restarts and docker compose down
    healthcheck: # Docker checks whether the database is ready
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
